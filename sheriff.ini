[project]
name = "myapp"

[analysis]
dependencies = true
tests = true # wraps go tests to ensure coverage and correctness
races = true # wraps go test -race to detect data races
vulnerabilities = true # wraps Go's govulncheck and gosec

# automatically apply fixes for detected issues into resulting binary, if possible
# Note: This does not modify your source code, every fix is applied in isolated space
[remediation]
dependencies = false # not yet implemented

# dependencies and packages to analyze, including versions
modules = [
    ".", # current project's source code

    # external dependencies with specific versions
    # "github.com/example/config@v1.4.0",
    # "github.com/example/auth@v2.1.0"
    "all" # analyze all dependencies in go.mod
]

[report]
html = true
json = true
output = ".sheriff/reports"